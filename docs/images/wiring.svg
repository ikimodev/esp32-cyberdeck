<title id="title">ESP32 Cyberdeck — connection overview</title><desc id="description">ESP32 outside the breadboard; SSD1306 in the center; ENTER and BACK on the left; UP and DOWN on the right. GPIO21 SDA, GPIO22 SCL, GPIO12 ENTER, GPIO27 BACK, GPIO14 UP, GPIO13 DOWN. Supply 3.3 volts and common ground.</desc>
