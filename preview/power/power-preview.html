class Cyberdeck {

  }

    if(this.page==='scan'){
      const elapsed=this.now-this.scanStartedAt;
      this.scanCount=Math.min(this.provider.length,Math.floor(elapsed/SCAN_MS*this.provider.length));
      if(elapsed>=SCAN_MS){

    if((priorPage==='breach'||priorPage==='abort')&&this.page==='failure')return;
    const direction=key==='down'?1:key==='up'?-1:0;
    if(this.page==='boot'){if(key==='enter')this.go('menu');return;}
    if(this.page==='idle'){this.go('menu');return;}
    if(this.page==='menu'){
      if(direction)this.menuIndex=clamp(this.menuIndex+direction,0,MENU.length-1);
      if(key==='enter')this.enterMenu();if(key==='back')this.go('idle');return;
    }
    if(this.page==='scan'){if(key==='back')this.go('menu');return;}
    if(['netlist','trackerSelect','securitySelect'].includes(this.page)){

      if(key==='back')this.go('menu');

        if(!this.networks.length){this.beginScan(this.page);return;}

      }
      return;
    }
    if(this.page==='details'){
      if(key==='back')this.go('netlist');
      if(key==='enter'){this.profileReturn='details';this.dataTab=0;this.go('security');}
      return;
    }
    if(this.page==='tracker'){
      if(key==='back')this.go('trackerSelect');
      if(direction&&this.networks.length){this.nodeIndex=(this.nodeIndex+direction+this.networks.length)%this.networks.length;this.history=[];this.sampleAt=this.now;this.sample(this.now);}

    if(this.page==='breachIntro'){

    }

    if(this.page==='abort'){

      if(key==='back'||key==='enter'&&this.abortIndex===0)this.go('breach');
      else if(key==='enter'){this.newGame();this.go('breachIntro');}return;
    }
    if(this.page==='success'||this.page==='failure'){
      if(key==='back')this.go('menu');
      if(key==='enter'){this.round++;this.newGame();this.go('breachIntro');}
    }
  }
  get demoSystem(){return {heap:184+Math.round(Math.sin(this.now/9000)*4),total:320,uptime:this.now,ap:'ON',sta:'IDLE',version:VERSION};}
  get description(){
    const names={boot:'تسلسل الإقلاع',menu:MENU[this.menuIndex],scan:'فحص شبكات تجريبي',netlist:'قائمة الشبكات التجريبية',trackerSelect:'اختر شبكة لمراقبة إشارتها',securitySelect:'اختر شبكة لعرض ملفها',details:'تفاصيل الشبكة',tracker:'رسم الإشارة التجريبية',security:`DATA — الصفحة ${this.dataTab+1} من 2`,system:'مراقبة النظام التجريبي',breachIntro:'Breach Protocol — الاستعداد',breach:'Breach Protocol — اللعب',abort:'تأكيد الخروج — المؤقت مستمر',success:'نجاح تسلسل Breach',failure:`فشل Breach: ${this.game.reason}`,idle:'مدينة الانتظار — أي زر يعيد القائمة'};
    return names[this.page]??this.page;
  }
}

    for(let i=0;i<9;i++){
      const x=2+(i%3)*20,y=20+Math.floor(i/3)*12,used=g.used.includes(i),selected=g.cursor===i;
      if(selected){f.rect(x,y,18,11,true);f.text(x+3,y+2,g.matrix[i],0);}
      else{
        if(legal.includes(i))f.reticle(x,y,18,11);
        f.text(x+3,y+2,g.matrix[i]);
        if(used){f.line(x,y+10,x+17,y);f.set(x+17,y+10);}
      }
    }
    f.line(64,19,64,55);f.text(70,19,'BUFFER');
    for(let i=0;i<4;i++){const x=70+i%2*28,y=29+Math.floor(i/2)*10;f.text(x,y,g.buffer[i]??'--');if(i===g.buffer.length)f.line(x,y+8,x+10,y+8);}
    const p=g.progress();for(let i=0;i<g.target.length;i++)f.rect(70+i*9,50,6,4,i<p);
    f.text(105,48,`${g.buffer.length}/4`);
    f.text(2,56,`${g.axis==='row'?'ROW':'COL'} ${g.axisIndex+1}`);f.text(86,56,'OK:ADD');
  }
  render(s){
    const changed=this.lastPage!==s.page;
    if(changed){this.previous=this.lastPage===null?null:this.f.bits.slice();this.transitionAt=s.now;this.cursorY=20;this.lastPage=s.page;}
    this.f.clear();this.renderPage(s);
    const dt=s.now-this.transitionAt;
    const exempt=['boot','idle','breach','success','failure'].includes(s.page);
    if(this.previous&&!this.reducedMotion&&!exempt&&dt<180){
      const target=this.f.bits.slice(),offset=Math.max(1,Math.round((1-dt/180)*128));
      const read=(data,x,y)=>x>=0&&x<128?((data[y*16+(x>>3)]>>(7-(x&7)))&1):0;
      for(let y=16;y<64;y++)for(let x=0;x<128;x++)this.f.set(x,y,x<offset?read(this.previous,x+128-offset,y):read(target,x-offset,y));
    }
    this.lastTime=s.now;return this.f;
  }
}

const POWER_BOOT_MS=10000, POWER_OFF_MS=900;

// Preview-only power state: off -> ten-second startup -> existing interface.
class PowerCyberdeck extends Cyberdeck {
  constructor(options={}){super(options);this.page='off';this.bootStartedAt=0;this.powerAt=0;}
  togglePower(time=this.now){
    this.tick(time);
    if(this.page==='shutdown')return;
    if(this.page==='off'){
      const now=this.now,revision=this.revision,menuIndex=this.menuIndex;
      Object.assign(this,new Cyberdeck({networks:this.provider,seed:this.seed}));
      this.now=now;this.pageAt=now;this.bootStartedAt=now;this.powerAt=now;this.lastInputAt=now;this.menuIndex=menuIndex;this.revision=revision+1;
    }else{this.powerAt=this.now;this.go('shutdown');}
  }
  tick(time){
    if(!Number.isFinite(time))return;
    this.now=Math.max(this.now,time);
    if(this.page==='off')return;
    if(this.page==='shutdown'){if(this.now-this.powerAt>=POWER_OFF_MS)this.go('off');return;}
    if(this.page==='boot'){
      if(this.now-this.bootStartedAt>=POWER_BOOT_MS){this.lastInputAt=this.now;this.go('menu');}
      return;
    }
    super.tick(this.now);
  }
  input(key,time=this.now){this.tick(time);if(['off','boot','shutdown'].includes(this.page))return;super.input(key,this.now);}
  get description(){
    if(this.page==='off')return 'الجهاز مطفأ';
    if(this.page==='boot')return 'CYBERDECK // POWER ON';
    if(this.page==='shutdown')return 'إطفاء الجهاز';
    return super.description;
  }
}


const unit=(value)=>Math.max(0,Math.min(1,value));
const ease=value=>{const p=unit(value);return p*p*(3-2*p);};
const LOGO_GLITCH_PERIOD_MS=2000, LOGO_GLITCH_BURST_MS=320;
class PowerRenderer extends OledRenderer {
  constructor(...args){super(...args);this.shutdownFrame=null;}
  pixel(bits,x,y){return x>=0&&x<128&&y>=0&&y<64?(bits[y*16+(x>>3)]>>(7-(x&7)))&1:0;}
  glitchLogo(asset,x,y,time,reveal=1){
    const f=this.f,phase=((time%LOGO_GLITCH_PERIOD_MS)+LOGO_GLITCH_PERIOD_MS)%LOGO_GLITCH_PERIOD_MS;
    f.bitmap(asset,x,y,{beam:this.reducedMotion?-100:phase/LOGO_GLITCH_PERIOD_MS*(asset.w+18)-9,reveal});
    if(this.reducedMotion||phase>=LOGO_GLITCH_BURST_MS)return;
    // Brief horizontal tears and a sparse echo; never invert/flash the whole display.
    const source=f.bits.slice(),magnitude=asset.w>100?6:3;
    const direction=phase<100?1:phase<220?-1:1;
    const strips=[[.28,2,direction*magnitude],[.56,asset.h>15?3:2,-direction*(magnitude-1)],[.8,1,direction*(magnitude+1)]];
    for(const [fraction,height,shift]of strips){
      const start=y+Math.floor(asset.h*fraction);
      for(let yy=start;yy<Math.min(y+asset.h,start+height);yy++)for(let xx=x;xx<x+asset.w;xx++){
        const from=xx-shift,ghost=xx+shift;
        const lit=from>=x&&from<x+asset.w&&this.pixel(source,from,yy);
        const echo=phase<160&&(xx+yy)%3===0&&ghost>=x&&ghost<x+asset.w&&this.pixel(source,ghost,yy);
        f.set(xx,yy,lit||echo?1:0);
      }
    }
  }
  fullLogo(time,reveal=1){this.glitchLogo(this.assets.logo,1,0,time,reveal);}
  header(title){
    const f=this.f;f.text(2,4,title);this.glitchLogo(this.assets.smallLogo,75,2,this.logoTime??0);
    f.line(0,15,85,15);f.line(90,15,127,15);
  }
  scaleFrame(bits,sx,sy){
    const f=this.f;f.bits.fill(0);
    if(sx<=0||sy<=0)return;
    const halfX=64*sx,halfY=32*sy;
    for(let y=0;y<64;y++)for(let x=0;x<128;x++){
      if(Math.abs(x-63.5)>halfX||Math.abs(y-31.5)>halfY)continue;
      const xx=Math.round((x-63.5)/sx+63.5),yy=Math.round((y-31.5)/sy+31.5);
      if(this.pixel(bits,xx,yy))f.set(x,y);
    }
  }
  startup(s){
    const f=this.f,t=s.now-s.bootStartedAt;
    if(t<650)return;
    if(this.reducedMotion){
      if(t<8800){this.city(0);this.fullLogo(2000);}else{const menu=Object.create(s);menu.page='menu';super.renderPage(menu);}return;
    }
    // A brief power seam opens into the image; it is not a progress meter.
    if(t<1600){
      const half=1+Math.round(ease((t-650)/950)*39);
      f.line(64-half,31,63+half,31);if(t>1200){f.set(63,30);f.set(64,32);}return;
    }
    this.city(t-1600);this.fullLogo(t-1600);
    if(t<3600){
      const frame=f.bits.slice(),p=ease((t-1600)/2000);
      this.scaleFrame(frame,.62+.38*p,.025+.975*p);return;
    }
    if(t<8800)return;
    // The menu unfolds from the same center, keeping the original pixels/identity.
    const city=f.bits.slice(),menu=Object.create(s);menu.page='menu';f.clear();super.renderPage(menu);
    const next=f.bits.slice(),p=ease((t-8800)/1200),hy=Math.ceil(32*p),hx=Math.ceil(64*Math.min(1,p*1.4));
    f.bits.set(city);
    for(let y=0;y<64;y++)for(let x=0;x<128;x++)if(Math.abs(y-31.5)<=hy&&Math.abs(x-63.5)<=hx)f.set(x,y,this.pixel(next,x,y));
  }
  render(s){
    this.logoTime=Math.max(0,s.now-(s.bootStartedAt??0)-1600);
    const powerPage=['off','boot','shutdown'].includes(s.page);
    if(!powerPage){
      if(['off','boot','shutdown'].includes(this.lastPage)){this.lastPage=s.page;this.previous=null;}
      return super.render(s);
    }
    const entered=this.lastPage!==s.page;
    if(entered&&s.page==='shutdown')this.shutdownFrame=this.f.bits.slice();
    this.lastPage=s.page;this.f.clear();
    if(s.page==='boot')this.startup(s);
    if(s.page==='shutdown'&&!this.reducedMotion){
      const t=s.now-s.powerAt;
      if(t<510){const p=ease(t/510);this.scaleFrame(this.shutdownFrame??new Uint8Array(1024),1-p*.15,Math.max(.015,1-p));}
      else if(t<760){const half=Math.round((1-ease((t-510)/250))*53);if(half) this.f.line(64-half,31,63+half,31);}
      else if(t<POWER_OFF_MS-40)this.f.set(64,31);
    }
    this.lastTime=s.now;return this.f;
  }
}

const root=document.getElementById('cyberdeck-power-preview');
const canvas=root.querySelector('canvas'),context=canvas.getContext('2d',{alpha:false});context.imageSmoothingEnabled=false;
const status=root.querySelector('#deck-status-v42'),reader=root.querySelector('#deck-reader-v42'),power=root.querySelector('#deck-reboot-v42');
const buttons=Object.fromEntries([...root.querySelectorAll('[data-key]')].map(button=>[button.dataset.key,button]));
const reduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const model=new PowerCyberdeck(),renderer=new PowerRenderer(ASSETS,{reducedMotion:reduced});
let epoch=performance.now(),lastPaint=-100,lastDescription='',disposed=false,hasInput=false;
function restore(saved){const index=saved?.privateContent?.menuIndex;if(!hasInput&&['off','boot'].includes(model.page)&&Number.isInteger(index))model.menuIndex=clamp(index,0,MENU.length-1);}
restore(window.openai?.widgetState);
function receive(event){restore(event.detail?.globals?.widgetState);}
window.addEventListener('openai:set_globals',receive);
function remember(){
  if(typeof window.openai?.setWidgetState==='function')window.openai.setWidgetState({modelContent:{preview:'Cyberdeck — power preview',selectedModule:MENU[model.menuIndex],power:model.page==='off'?'off':'on'},privateContent:{menuIndex:model.menuIndex}}).catch(()=>{});
}
function describe(){
  const locked=['off','boot','shutdown'].includes(model.page);
  for(const button of Object.values(buttons))button.disabled=locked;
  power.disabled=model.page==='shutdown';power.textContent=model.page==='off'?'تشغيل الجهاز':'إطفاء الجهاز';
  power.setAttribute('aria-label',power.textContent);power.setAttribute('aria-pressed',String(model.page!=='off'));
  root.dataset.page=model.page;
  let text=model.description;
  if(['netlist','trackerSelect','securitySelect','details','tracker','security'].includes(model.page)&&model.networks.length)text+=' — '+nodeName(model.node());
  if(model.page==='breach'){const g=model.game;text+=` — ${g.axis==='row'?'صف':'عمود'} ${g.axisIndex+1}: ${g.matrix[g.cursor]} — Buffer: ${g.buffer.join(' ')||'فارغ'}`;}
  if(text!==lastDescription){status.textContent=text;reader.textContent=text;canvas.setAttribute('aria-label',text);lastDescription=text;}
}
function paint(){context.putImageData(new ImageData(renderer.render(model).rgba(),128,64),0,0);describe();}
function input(key){hasInput=true;model.input(key,performance.now()-epoch);paint();remember();const button=buttons[key];button.classList.add('pressed');setTimeout(()=>button.classList.remove('pressed'),120);}
for(const [key,button]of Object.entries(buttons))button.addEventListener('click',()=>input(key));
power.addEventListener('click',()=>{hasInput=true;model.togglePower(performance.now()-epoch);paint();remember();});
function keyboard(event){
  if(!root.isConnected)return;
  const active=document.activeElement;
  if(active&&active!==document.body&&!root.contains(active))return;
  if(active===power||active?.tagName==='SUMMARY')return;
  const key={ArrowUp:'up',ArrowDown:'down',Enter:'enter',Escape:'back'}[event.key];if(!key)return;
  event.preventDefault();if(!event.repeat)input(key);
}
document.addEventListener('keydown',keyboard);
function animate(timestamp){
  if(disposed)return;
  if(!root.isConnected){disposed=true;document.removeEventListener('keydown',keyboard);window.removeEventListener('openai:set_globals',receive);return;}
  model.tick(timestamp-epoch);if(timestamp-lastPaint>=1000/12){paint();lastPaint=timestamp;}requestAnimationFrame(animate);
}
paint();requestAnimationFrame(animate);

})();
</script>
